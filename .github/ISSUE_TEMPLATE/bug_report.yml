name: Bug report
description: Report a reproducible application or input-behavior problem.
body:
  - type: markdown
    attributes:
      value: |
        Do not upload stock or modified firmware, the manufacturer updater, serial numbers, or private paths. Maintainers do not need your .rfb file. Redact logs and screenshots before sharing them.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include project commit or release, operating system, Python version, and exact keyboard model.
    validations:
      required: true
  - type: input
    id: stock-hash
    attributes:
      label: Stock input SHA-256
      description: Paste the hash only. Do not attach the firmware file.
    validations:
      required: true
  - type: textarea
    id: profile
    attributes:
      label: RT and APC settings
      description: List enabled keys, release/re-press levels, and the stock global APC selection. A redacted profile is acceptable.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include whether the issue follows boot, USB reconnect, sleep/wake, or a stock-setting change.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
      description: Distinguish normal key events, Raw measurements, and game-level observations. Say whether the generated firmware identity is known or the installed firmware was independently confirmed.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted output or other evidence
      description: Include relevant error text or hash values only. Remove serial numbers and private paths.
